name: CI/CD - infra-k8s

on:
  # Disparado pelo repositório app (job dispatch-deploy) quando uma imagem
  # nova é publicada — é isso que torna o deploy "automático" entre repos
  # separados, sem um cron nem um "rodar manualmente".
  repository_dispatch:
    types: [deploy]
  # Fallback pra testar/disparar manualmente sem precisar de uma imagem nova
  workflow_dispatch:
    inputs:
      image:
        description: "Imagem publicada pelo repositório app (ghcr.io/.../autoshop-api:sha)"
        required: true
  pull_request:
    branches: [main]

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/ci init
      - run: terraform -chdir=infra/ci validate

  # Cluster kind efêmero dentro do próprio runner — mesma lógica que já
  # existia no monorepo, só que agora reage a um evento vindo de outro
  # repositório em vez de rodar no push do próprio código da aplicação.
  deploy-local:
    name: Deploy Homologação (kind efêmero, smoke test)
    needs: terraform-validate
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'homolog'
    runs-on: ubuntu-latest
    env:
      TF_VAR_image: ${{ github.event.client_payload.image || github.event.inputs.image }}
      TF_VAR_ghcr_username: ${{ github.actor }}
      TF_VAR_ghcr_token: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: infra/ci
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform init
        run: terraform init

      - name: Terraform apply (cluster + namespace + banco + config + app)
        run: |
          for i in 1 2 3; do
            terraform apply -auto-approve -parallelism=1 && exit 0
            echo "tentativa $i falhou, aguardando antes de tentar de novo..." >&2
            sleep 20
          done
          exit 1

      - name: Aguardar o Job de migration do banco terminar
        run: |
          KUBECONFIG_PATH=$(terraform output -raw kubeconfig_path)
          kubectl wait --for=condition=complete job/db-migrate -n autoshop --timeout=300s --kubeconfig "$KUBECONFIG_PATH"

      - name: Aguardar o rollout do Deployment concluir
        run: |
          KUBECONFIG_PATH=$(terraform output -raw kubeconfig_path)
          kubectl rollout status deployment/autoshop-api -n autoshop --timeout=300s --kubeconfig "$KUBECONFIG_PATH"

      - name: Smoke test — health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:30080/health; then
              exit 0
            fi
            sleep 3
          done
          echo "health check falhou depois de várias tentativas" >&2
          exit 1

      - name: Terraform destroy (encerra o cluster efêmero — cosmético, o runner morre de qualquer forma)
        if: always()
        continue-on-error: true
        run: terraform destroy -auto-approve

  # Deploy no cluster EKS real — desligado por padrão (variável de
  # repositório AWS_DEPLOY_ENABLED).
  deploy-aws:
    name: Deploy Produção (EKS real)
    needs: terraform-validate
    if: (github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'production') && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      KUSTOMIZE_VERSION: v5.8.1
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: autoshop-eks
      IMAGE: ${{ github.event.client_payload.image || github.event.inputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS via OIDC (sem chave fixa)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apontar kubectl para o cluster EKS
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Instalar kustomize (binário oficial, com verificação de checksum)
        run: |
          curl --proto '=https' --tlsv1.2 -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf "kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          sudo mv kustomize /usr/local/bin/

      - name: Definir a imagem publicada pelo repositório app
        working-directory: k8s/overlays/aws
        run: kustomize edit set image autoshop-api=${{ env.IMAGE }}

      - name: Injetar a IRSA role na service account
        env:
          IRSA_ROLE_ARN: ${{ secrets.IRSA_ROLE_ARN }}
        run: |
          if [ -z "$IRSA_ROLE_ARN" ]; then
            echo "Secret IRSA_ROLE_ARN não configurado — veja infra/README.md" >&2
            exit 1
          fi
          sed -i "s#IRSA_ROLE_ARN_PLACEHOLDER#${IRSA_ROLE_ARN}#" k8s/overlays/aws/serviceaccount.yaml

      - name: Injetar o endpoint do RDS no ConfigMap
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          if [ -z "$DB_HOST" ]; then
            echo "Secret DB_HOST não configurado — copie o output rds_endpoint do infra-db, veja infra/README.md" >&2
            exit 1
          fi
          sed -i "s#DB_HOST_PLACEHOLDER#${DB_HOST}#" k8s/overlays/aws/configmap.yaml

      - name: Injetar o JWT_SECRET no Secret
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "Secret JWT_SECRET não configurado — veja infra/README.md" >&2
            exit 1
          fi
          sed -i "s#JWT_SECRET_PLACEHOLDER#${JWT_SECRET}#" k8s/overlays/aws/secret.yaml

      - name: Aplicar manifestos no cluster (Deployment, Service, HPA, ConfigMap/Secret)
        run: kubectl apply -k k8s/overlays/aws

      - name: Aguardar o rollout concluir
        run: kubectl rollout status deployment/autoshop-api -n autoshop --timeout=180s
