name: CI/CD - infra-k8s

on:
  # Disparado pelo repositório app (job dispatch-deploy) quando uma imagem
  # nova é publicada — é isso que torna o deploy "automático" entre repos
  # separados, sem um cron nem um "rodar manualmente".
  repository_dispatch:
    types: [deploy]
  # Fallback pra testar/disparar manualmente sem precisar de uma imagem nova
  workflow_dispatch:
    inputs:
      image:
        description: "Imagem publicada pelo repositório app (ghcr.io/.../autoshop-api:sha)"
        required: true
  pull_request:
    branches: [main, develop]

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/ci init
      - run: terraform -chdir=infra/ci validate

  # Cluster kind efêmero dentro do próprio runner — mesma lógica que já
  # existia no monorepo, só que agora reage a um evento vindo de outro
  # repositório em vez de rodar no push do próprio código da aplicação.
  #
  # Desde a reorganização pedida pelo professor, os manifestos da aplicação
  # (Deployment, Service, HPA, ConfigMap, Secret, ServiceAccount) passaram a
  # ser versionados no repositório app-autoshop, não aqui. Como esse cluster
  # é efêmero e só existe dentro deste job (não dá pra outro repositório
  # alcançá-lo depois), este job baixa o conteúdo desses arquivos via API do
  # GitHub e aplica dentro do próprio teste — os arquivos continuam
  # pertencendo ao app-autoshop, este repositório só os consome como leitura
  # pra este teste passageiro.
  deploy-local:
    name: Deploy Homologação (kind efêmero, smoke test)
    needs: terraform-validate
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'homolog'
    runs-on: ubuntu-latest
    env:
      TF_VAR_image: ${{ github.event.client_payload.image || github.event.inputs.image }}
      TF_VAR_ghcr_username: ${{ github.actor }}
      TF_VAR_ghcr_token: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: infra/ci
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Baixar os schemas de migration do repositório app
        env:
          TOKEN: ${{ secrets.APP_REPO_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Secret APP_REPO_READ_TOKEN não configurado — veja infra/README.md" >&2
            exit 1
          fi
          declare -A MIGRATIONS=(
            [migration_sql]="migrations/000001_init_schema.up.sql"
            [migration_sql_2]="migrations/000002_add_customer_status.up.sql"
          )
          for VAR in "${!MIGRATIONS[@]}"; do
            REPO_PATH="${MIGRATIONS[$VAR]}"
            curl -sfL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/Jackeline2020/app-autoshop/contents/${REPO_PATH}" \
              -o /tmp/"${VAR}".sql
            {
              echo "TF_VAR_${VAR}<<EOF_${VAR}"
              cat /tmp/"${VAR}".sql
              echo "EOF_${VAR}"
            } >> "$GITHUB_ENV"
          done

      - name: Baixar os manifestos Kubernetes do repositório app
        env:
          TOKEN: ${{ secrets.APP_REPO_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Secret APP_REPO_READ_TOKEN não configurado — veja infra/README.md" >&2
            exit 1
          fi
          declare -A FILES=(
            [deployment_yaml]="k8s/base/deployment.yaml"
            [service_yaml]="k8s/base/service.yaml"
            [hpa_yaml]="k8s/base/hpa.yaml"
            [configmap_yaml]="k8s/overlays/local/configmap.yaml"
            [secret_yaml]="k8s/overlays/local/secret.yaml"
            [serviceaccount_yaml]="k8s/overlays/local/serviceaccount.yaml"
          )
          for VAR in "${!FILES[@]}"; do
            REPO_PATH="${FILES[$VAR]}"
            curl -sfL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/Jackeline2020/app-autoshop/contents/${REPO_PATH}" \
              -o /tmp/"${VAR}".yaml
            {
              echo "TF_VAR_${VAR}<<EOF_${VAR}"
              cat /tmp/"${VAR}".yaml
              echo "EOF_${VAR}"
            } >> "$GITHUB_ENV"
          done

      - name: Terraform init
        run: terraform init

      - name: Terraform apply (cluster + namespace + banco + config + app)
        run: |
          for i in 1 2 3; do
            terraform apply -auto-approve -parallelism=1 && exit 0
            echo "tentativa $i falhou, aguardando antes de tentar de novo..." >&2
            sleep 20
          done
          exit 1

      - name: Aguardar o Job de migration do banco terminar
        run: |
          KUBECONFIG_PATH=$(terraform output -raw kubeconfig_path)
          kubectl wait --for=condition=complete job/db-migrate -n autoshop --timeout=300s --kubeconfig "$KUBECONFIG_PATH"

      - name: Aguardar o rollout do Deployment concluir
        run: |
          KUBECONFIG_PATH=$(terraform output -raw kubeconfig_path)
          kubectl rollout status deployment/autoshop-api -n autoshop --timeout=300s --kubeconfig "$KUBECONFIG_PATH"

      - name: Diagnóstico do Deployment (só roda se o rollout falhar)
        if: failure()
        run: |
          KUBECONFIG_PATH=$(terraform output -raw kubeconfig_path)
          echo "--- pods ---"
          kubectl get pods -n autoshop -o wide --kubeconfig "$KUBECONFIG_PATH"
          echo "--- describe deployment ---"
          kubectl describe deployment/autoshop-api -n autoshop --kubeconfig "$KUBECONFIG_PATH"
          echo "--- describe pods ---"
          kubectl describe pods -n autoshop -l app=autoshop-api --kubeconfig "$KUBECONFIG_PATH"
          echo "--- logs (container atual) ---"
          kubectl logs -n autoshop -l app=autoshop-api --all-containers --tail=200 --kubeconfig "$KUBECONFIG_PATH" || true
          echo "--- logs (container anterior, caso tenha reiniciado) ---"
          kubectl logs -n autoshop -l app=autoshop-api --all-containers --tail=200 --previous --kubeconfig "$KUBECONFIG_PATH" || true
          
      - name: Smoke test — health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:30080/health; then
              exit 0
            fi
            sleep 3
          done
          echo "health check falhou depois de várias tentativas" >&2
          exit 1

      - name: Terraform destroy (encerra o cluster efêmero — cosmético, o runner morre de qualquer forma)
        if: always()
        continue-on-error: true
        run: terraform destroy -auto-approve

  # Provisiona (ou atualiza) o cluster EKS real — desligado por padrão
  # (variável de repositório AWS_DEPLOY_ENABLED). Desde a reorganização
  # pedida pelo professor, este job cuida SÓ da infraestrutura do cluster
  # (Terraform de infra/aws: cluster, node groups, rede, add-ons via IRSA).
  # A aplicação dos manifestos da aplicação (Deployment, Service, HPA,
  # ConfigMap, Secret) no cluster real não acontece mais aqui — passou a
  # ser responsabilidade do próprio repositório app-autoshop, que se
  # autentica de forma independente e aplica seus próprios manifestos,
  # exatamente como pedido: "separar o ciclo de vida da infraestrutura do
  # ciclo de vida da aplicação".
  deploy-aws:
    name: Provisionar Cluster EKS (Produção)
    needs: terraform-validate
    if: (github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'production') && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TF_VAR_rds_secret_arn: ${{ secrets.RDS_SECRET_ARN }}
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Configurar credenciais AWS via OIDC (sem chave fixa)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply (cluster EKS, node groups, rede, add-ons)
        run: terraform apply -auto-approve