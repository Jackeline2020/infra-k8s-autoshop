# Placeholders — este arquivo é aplicado via "kubectl apply -k" e não deve chegar num ambiente AWS
# real com esses valores. Antes de ligar o deploy AWS, troque os valores abaixo por segredos reais
# (a senha do RDS gerada pelo Terraform está no Secrets Manager — ver output rds_secret_arn em
# infra/aws — não deveria, idealmente, ser copiada pra cá; o caminho de produção é o pod ler a
# credencial em runtime via IRSA, não recebê-la como env var do Kubernetes).
apiVersion: v1
kind: Secret
metadata:
  name: autoshop-secrets
  namespace: autoshop
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_BEFORE_REAL_DEPLOY"
  EMAIL_WEBHOOK_SECRET: "CHANGE_ME_BEFORE_REAL_DEPLOY"
  DB_PASSWORD: "CHANGE_ME_BEFORE_REAL_DEPLOY"
